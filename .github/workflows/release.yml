# 版本号 bump 后自动打 Windows NSIS 安装包并创建 GitHub Release（含 What's Changed）。
# 版本唯一来源：package.json；CI 会 yarn sync-version 写回 tauri.conf / Cargo。
# 触发：main 上 package.json 变更，或手动 Run workflow。
#
# 产物命名类似：new-pet-1.0.1-windows-x64-setup.exe

name: Release

on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:
    inputs:
      force:
        description: Force release even if version equals previous commit
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.gate.outputs.should_release }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate on package.json version bump
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version package.json)"

          if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
            echo "::error::package.json version missing"
            exit 1
          fi

          PREV=""
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            PREV="$(git show HEAD^:package.json 2>/dev/null | jq -r .version || true)"
          fi

          FORCE=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force }}" == "true" ]]; then
            FORCE=true
          fi

          SHOULD=false
          if [[ "$FORCE" == "true" ]]; then
            SHOULD=true
          elif [[ -z "$PREV" || "$PREV" == "null" || "$PREV" != "$VERSION" ]]; then
            SHOULD=true
          fi

          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::warning::tag v${VERSION} already exists — skip release"
            SHOULD=false
          fi

          if [[ "$SHOULD" != "true" ]]; then
            echo "No version bump (prev=${PREV:-none} cur=${VERSION}); skip."
          else
            echo "Will release v${VERSION} (prev=${PREV:-none})"
          fi

          echo "should_release=${SHOULD}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend deps
        run: yarn install --frozen-lockfile

      - name: Sync version from package.json
        run: yarn sync-version

      - name: Build & upload to GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 新宠 v__VERSION__
          generateReleaseNotes: true
          releaseBody: |
            ## 下载

            - **Windows**：`new-pet-*-windows-*-setup.exe`（NSIS 安装包）

            当前仅提供 Windows 安装包。
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
          releaseAssetNamePattern: "[mainBinaryName]-[version]-[platform]-[arch][setup].[ext]"
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          retryAttempts: 1
